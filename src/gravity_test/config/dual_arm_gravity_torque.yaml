# dynamics gravity_compensation_node for both daksha arms.
#
# Publishes /feedforward_torque (and the G-only /gravity_torque) for left_joint_1..7 and right_joint_1..7 in URDF convention.
# gen2's joint_cmd.py adds it to the arm effort; the hardware 'direction' must still be applied
# before hw_interface (it sends effort unflipped):
#   right: 1, 1, -1, -1, -1, 1, 1      left: 1, -1, 1, -1, -1, -1, 1
# Max |tau_g| over reachable poses is about 11 / 11 / 4.6 / 4.6 / 1.2 / 1.6 / 0.7 Nm.
gravity_compensation_node:
  ros__parameters:
    root_link: base_link
    # Gripper mount, fingers and tcp hang below these and are included.
    tip_links: [left_link_8, right_link_8]
    gravity_vector: [0.0, 0.0, -9.81]
    gravity_scale: 1.0
    # Ramp, feedforward_scale, inertia/coriolis scales: dynamics/config/feedforward.yaml
