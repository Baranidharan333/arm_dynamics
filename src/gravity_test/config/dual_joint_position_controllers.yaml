
# Controllers for the two-joint rig in position mode (dual_joint_position.launch.py).
#
# Same as dual_joint_controllers.yaml, but the motors run DM POS_VEL (hw_interface 'posvel'):
# the motor's own position loop tracks the position, the velocity field is its speed limit,
# and effort is ignored. One controller per joint, each fed by its own joint_cmd node.

controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint1_position_controller:
      type: posveleff_controllers/PosVelEffController

    joint2_position_controller:
      type: posveleff_controllers/PosVelEffController

joint1_position_controller:
  ros__parameters:
    joints:
      - joint1

joint2_position_controller:
  ros__parameters:
    joints:
      - joint2
