
# Controllers for the two-joint rig (dual_joint_1kg.urdf, DualJointSystem).
#
# One PosVelEffController per joint, so each joint gets its own joint_cmd node instance
# (limited /joint_cmd position plus the /feedforward_torque for that joint).

controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint1_mit_controller:
      type: posveleff_controllers/PosVelEffController

    joint2_mit_controller:
      type: posveleff_controllers/PosVelEffController

joint1_mit_controller:
  ros__parameters:
    joints:
      - joint1

joint2_mit_controller:
  ros__parameters:
    joints:
      - joint2
