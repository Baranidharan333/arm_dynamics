# Feedforward tuning for gravity_compensation_node. Same for every rig.
# Rig-specific settings (root_link, tip_links, gravity_vector, gravity_scale) live in the rig's
# own params file, e.g. gravity_test/config/*_gravity_torque.yaml, loaded after this one.
#
#   tau_ff = feedforward_scale * ramp(t) * ( inertia_scale  * M(q_d) ddq_d
#                                          + coriolis_scale * C(q_d, dq_d) dq_d
#                                          + gravity_scale  * G(q) )
#
# All of these can also be changed while running, e.g.
#   ros2 param set /gravity_compensation_node feedforward_scale 0.5
gravity_compensation_node:
  ros__parameters:
    # Start-up ramp: at launch the arm is at rest, so tau_ff fades in smoothly from 0 to full
    # over this many seconds instead of being applied all at once. Runs once, from the first
    # torque published. 0 = off.
    ramp_duration: 1.0

    # Overall factor on the whole tau_ff (1.0 = 100% of the model).
    feedforward_scale: 0.85

    # Per-term factors (1.0 = 100% of that term). 0.0 drops the term.
    inertia_scale: 1.0     # M(q_d) ddq_d
    coriolis_scale: 1.0    # C(q_d, dq_d) dq_d

    # /joint_desired older than this [s] is ignored for that joint (only G is sent).
    desired_timeout: 0.1
