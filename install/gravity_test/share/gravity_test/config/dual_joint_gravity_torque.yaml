# gravity_compensation gravity_torque_node for the two-joint rig (dual_joint_1kg.urdf).
gravity_torque_node:
  ros__parameters:
    root_link: base_link
    # Chain base_link -> arm_link -> motor2_link -> arm2_link; load_link hangs below arm2_link
    # and is included.
    tip_links: [arm2_link]
    gravity_vector: [0.0, 0.0, -9.81]
    # 1.0 = 100% of the model torque:
    #   joint1: 7.5329 * sin(q1) + 4.9038 * sin(q1 + q2)  (max ~12.4 Nm)
    #   joint2: 4.9038 * sin(q1 + q2)                     (max ~4.9 Nm)
    # Can be changed live.
    gravity_scale: 1.0
